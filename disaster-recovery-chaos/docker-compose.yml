version: '3.8'

services:
  db_primary:
    image: postgres:15-alpine
    container_name: db_primary
    environment:
      POSTGRES_USER: enterprise_admin
      POSTGRES_PASSWORD: SecretPassword123
      POSTGRES_DB: core_records
    ports:
      - "5432:5432"
    volumes:
      - primary_data:/var/lib/postgresql/data

  db_replica_dr:
    image: postgres:15-alpine
    container_name: db_replica_dr
    environment:
      POSTGRES_USER: enterprise_admin
      POSTGRES_PASSWORD: SecretPassword123
      POSTGRES_DB: core_records_dr
    ports:
      - "5433:5432"
    volumes:
      - dr_data:/var/lib/postgresql/data

volumes:
  primary_data:
  dr_data:
